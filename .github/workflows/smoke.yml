name: Smoke - run a built APK on an emulator

# Started by hand: installs the APK of a build run on an Android emulator, plays for a few
# seconds and uploads screenshots and the log.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run id whose APK to test'
        required: true
      artifact:
        description: 'Artifact name'
        required: true
        default: 'rolling-legends-release'

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.run_id }} -n ${{ inputs.artifact }} -D apk
          ls -la apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tool/smoke.sh

      - name: Upload log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: smoke/
          retention-days: 14
